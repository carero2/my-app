<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Gastos</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F4F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gastos">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --paper:#F5F4F0; --ink:#1C1B19; --muted:#6E6A63; --line:#E2DFD8; --card:#FFFFFF;
  --comida:#C7513F; --transporte:#3E6FA8; --ocio:#D98A2B;
  --hogar:#4E8A5B; --salud:#7A5BA6; --compras:#8C8378; --otros:#5F5A54;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#17181A; --ink:#F0EEE9; --muted:#9A958C; --line:#2C2E31; --card:#202225; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--paper); color:var(--ink);
  font:400 17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  overscroll-behavior-y:contain;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:8px 20px 132px}

/* Cabecera */
header{padding:22px 0 6px}
.mes{color:var(--muted);font-size:15px}
.total{
  font-size:clamp(46px,15vw,68px);font-weight:600;letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;line-height:1;margin:6px 0 18px;
}
.total .cent{font-size:.5em;font-weight:500;letter-spacing:-.01em;vertical-align:.42em;margin-left:2px}
.barra{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--line);gap:2px}
.barra span{min-width:3px}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:14px;color:var(--muted)}
.leyenda i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:7px;vertical-align:.5px}

/* Lista */
h2{font-size:14px;font-weight:600;color:var(--muted);margin:30px 0 10px}
.dia{margin-bottom:22px}
.dia-cab{display:flex;justify-content:space-between;align-items:baseline;
  padding:0 4px 8px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
ul{list-style:none;margin:0;padding:0;background:var(--card);border-radius:16px;overflow:hidden}
li{display:flex;align-items:center;gap:14px;padding:13px 16px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.punto{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:17px}
.txt{flex:1;min-width:0}
.txt b{display:block;font-weight:500;font-size:16px}
.txt small{color:var(--muted);font-size:13px}
.imp{font-variant-numeric:tabular-nums;font-weight:500;letter-spacing:-.01em}
.borrar{color:var(--muted);padding:6px 2px 6px 10px;font-size:15px}
.vacio{text-align:center;color:var(--muted);padding:56px 20px;line-height:1.6}

/* Barra inferior */
.pie{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--paper) 62%,transparent);
  padding:16px 20px calc(18px + env(safe-area-inset-bottom));display:flex;gap:12px;justify-content:center}
.pie .add{background:var(--ink);color:var(--paper);border-radius:99px;padding:16px 0;
  font-size:18px;font-weight:600;flex:1;max-width:400px}
.pie .mas{background:var(--card);border:1px solid var(--line);border-radius:99px;width:56px;font-size:20px}

/* Hoja de entrada */
.hoja{position:fixed;inset:0;background:var(--paper);z-index:20;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) 0 calc(10px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);visibility:hidden}
.hoja.on{transform:none;visibility:visible}
@media (prefers-reduced-motion:reduce){.hoja{transition:none}}
.hoja-cab{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;font-size:17px}
.hoja-cab .ok{font-weight:600;opacity:.35;pointer-events:none}
.hoja-cab .ok.listo{opacity:1;pointer-events:auto}
.cifra{text-align:center;font-size:clamp(52px,17vw,76px);font-weight:600;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;padding:14px 20px 4px}
.cifra.cero{color:var(--muted)}
.nota{display:block;width:calc(100% - 40px);margin:0 20px 8px;padding:11px 14px;text-align:center;
  background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--ink);font:inherit;font-size:15px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 20px}
.cat{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:11px 4px 9px;
  display:grid;gap:3px;justify-items:center;font-size:12px;color:var(--muted)}
.cat span{font-size:21px;line-height:1.15}
.cat[aria-pressed=true]{color:#fff;border-color:transparent}
.teclas{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:6px 14px 0;margin-top:auto}
.teclas button{background:var(--card);border-radius:14px;padding:17px 0;font-size:26px;font-weight:500;
  font-variant-numeric:tabular-nums}
.teclas button:active{background:var(--line)}

/* Ajustes */
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:none;place-items:center;padding:24px}
.dlg.on{display:grid}
.dlg-caja{background:var(--card);border-radius:20px;padding:22px;width:100%;max-width:360px}
.dlg-caja h3{margin:0 0 4px;font-size:19px}
.dlg-caja p{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.5}
.dlg-caja button{display:block;width:100%;text-align:left;padding:14px 2px;border-top:1px solid var(--line);font-size:16px}
.aviso{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
  background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:99px;font-size:15px;
  opacity:0;pointer-events:none;transition:.2s;z-index:40}
.aviso.on{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:2.5px solid var(--transporte);outline-offset:2px}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="mes" id="mes"></div>
    <div class="total" id="total"></div>
    <div class="barra" id="barra"></div>
    <div class="leyenda" id="leyenda"></div>
  </header>
  <div id="lista"></div>
</div>

<div class="pie">
  <button class="add" id="abrir">Añadir gasto</button>
  <button class="mas" id="abrirAjustes" aria-label="Ajustes">⋯</button>
</div>

<section class="hoja" id="hoja" aria-hidden="true">
  <div class="hoja-cab">
    <button id="cancelar">Cancelar</button>
    <button class="ok" id="guardar">Guardar</button>
  </div>
  <div class="cifra cero" id="cifra">0,00 €</div>
  <input class="nota" id="nota" placeholder="Nota (opcional)" autocomplete="off">
  <div class="cats" id="cats"></div>
  <div class="teclas" id="teclas"></div>
</section>

<div class="dlg" id="ajustes">
  <div class="dlg-caja">
    <h3>Tus datos</h3>
    <p>Todo se guarda solo en este móvil. Descarga una copia de vez en cuando.</p>
    <button id="exportar">Descargar copia (.json)</button>
    <button id="importar">Restaurar desde copia</button>
    <button id="csv">Exportar a CSV</button>
    <button id="cerrarAjustes">Cerrar</button>
  </div>
</div>

<div class="aviso" id="aviso"></div>
<input type="file" id="fichero" accept="application/json" hidden>

<script>
const CATS = [
  {id:'comida',      nom:'Comida',     emo:'🍽'},
  {id:'transporte',  nom:'Transporte', emo:'🚇'},
  {id:'compras',     nom:'Compras',    emo:'🛍'},
  {id:'ocio',        nom:'Ocio',       emo:'🍺'},
  {id:'hogar',       nom:'Hogar',      emo:'🏠'},
  {id:'salud',       nom:'Salud',      emo:'💊'},
  {id:'otros',       nom:'Otros',      emo:'📦'},
];
const color = id => getComputedStyle(document.documentElement).getPropertyValue('--'+id).trim() || '#888';
const CLAVE = 'gastos.v1';
const eur = n => n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';

let gastos = cargar();
function cargar(){
  try { return JSON.parse(localStorage.getItem(CLAVE)) || [] } catch { return [] }
}
function salvar(){
  try { localStorage.setItem(CLAVE, JSON.stringify(gastos)) }
  catch { avisar('No se pudo guardar. ¿Sin espacio?') }
}
function avisar(t){
  const a = document.getElementById('aviso');
  a.textContent = t; a.classList.add('on');
  clearTimeout(a._t); a._t = setTimeout(()=>a.classList.remove('on'), 1900);
}

/* ---------- Pintar ---------- */
function pintar(){
  const hoy = new Date();
  const desde = new Date(hoy.getFullYear(), hoy.getMonth(), 1).getTime();
  const mes = gastos.filter(g => g.t >= desde);
  const total = mes.reduce((s,g) => s + g.c, 0);

  document.getElementById('mes').textContent =
    hoy.toLocaleDateString('es-ES',{month:'long', year:'numeric'}).replace(/^./, m=>m.toUpperCase());

  const [ent, dec] = total.toLocaleString('es-ES',{minimumFractionDigits:2}).split(',');
  document.getElementById('total').innerHTML = ent + '<span class="cent">,' + dec + ' €</span>';

  const porCat = CATS.map(c => ({...c, suma: mes.filter(g=>g.cat===c.id).reduce((s,g)=>s+g.c,0)}))
                     .filter(c => c.suma > 0).sort((a,b)=>b.suma-a.suma);
  document.getElementById('barra').innerHTML = porCat.map(c =>
    `<span style="flex:${c.suma};background:${color(c.id)}"></span>`).join('');
  document.getElementById('leyenda').innerHTML = porCat.slice(0,4).map(c =>
    `<div><i style="background:${color(c.id)}"></i>${c.nom} ${eur(c.suma)}</div>`).join('');

  const lista = document.getElementById('lista');
  if(!gastos.length){
    lista.innerHTML = '<p class="vacio">Todavía no hay nada.<br>Pulsa «Añadir gasto» tras pagar.</p>';
    return;
  }
  const dias = {};
  [...gastos].sort((a,b)=>b.t-a.t).forEach(g => (dias[new Date(g.t).toDateString()] ||= []).push(g));

  lista.innerHTML = Object.entries(dias).map(([d, gs]) => {
    const f = new Date(d);
    const etiqueta = f.toDateString() === hoy.toDateString() ? 'Hoy'
      : f.toLocaleDateString('es-ES',{weekday:'long', day:'numeric', month:'short'});
    const suma = gs.reduce((s,g)=>s+g.c,0);
    return `<div class="dia">
      <div class="dia-cab"><span>${etiqueta}</span><span>${eur(suma)}</span></div>
      <ul>${gs.map(g => {
        const c = CATS.find(x=>x.id===g.cat) || CATS.at(-1);
        return `<li>
          <div class="punto" style="background:${color(c.id)}22">${c.emo}</div>
          <div class="txt"><b>${g.n ? escapar(g.n) : c.nom}</b>
            <small>${g.n ? c.nom + ' · ' : ''}${new Date(g.t).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}</small></div>
          <div class="imp">${eur(g.c)}</div>
          <button class="borrar" data-id="${g.id}" aria-label="Borrar gasto">✕</button>
        </li>`;
      }).join('')}</ul></div>`;
  }).join('');
}
const escapar = s => s.replace(/[<>&"]/g, m => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[m]));

document.getElementById('lista').addEventListener('click', e => {
  const b = e.target.closest('.borrar'); if(!b) return;
  gastos = gastos.filter(g => g.id !== b.dataset.id);
  salvar(); pintar(); avisar('Gasto borrado');
});

/* ---------- Hoja de entrada ---------- */
const hoja = document.getElementById('hoja');
let buffer = '', catSel = 'comida';

document.getElementById('cats').innerHTML = CATS.map(c =>
  `<button class="cat" data-id="${c.id}" aria-pressed="false"><span>${c.emo}</span>${c.nom}</button>`).join('');
document.getElementById('teclas').innerHTML =
  [1,2,3,4,5,6,7,8,9,',',0,'⌫'].map(k => `<button data-k="${k}">${k}</button>`).join('');

function valor(){
  if(!buffer) return 0;
  const [e, d=''] = buffer.split(',');
  return parseFloat((e||'0') + '.' + d.padEnd(2,'0').slice(0,2)) || 0;
}
function refrescar(){
  const c = document.getElementById('cifra');
  c.textContent = buffer ? buffer + ' €' : '0,00 €';
  c.classList.toggle('cero', !buffer);
  document.getElementById('guardar').classList.toggle('listo', valor() > 0);
}
function marcarCat(){
  document.querySelectorAll('.cat').forEach(b => {
    const on = b.dataset.id === catSel;
    b.setAttribute('aria-pressed', on);
    b.style.background = on ? color(b.dataset.id) : '';
  });
}
document.getElementById('cats').addEventListener('click', e => {
  const b = e.target.closest('.cat'); if(!b) return;
  catSel = b.dataset.id; marcarCat();
});
document.getElementById('teclas').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  const k = b.dataset.k;
  if(k === '⌫') buffer = buffer.slice(0,-1);
  else if(k === ','){ if(!buffer.includes(',')) buffer = (buffer || '0') + ','; }
  else if(!(buffer.includes(',') && buffer.split(',')[1].length >= 2) && buffer.replace(',','').length < 9)
    buffer += k;
  navigator.vibrate?.(8);
  refrescar();
});

function abrirHoja(cat){
  buffer = ''; if(cat && CATS.some(c=>c.id===cat)) catSel = cat;
  refrescar(); marcarCat();
  document.getElementById('nota').value = '';
  hoja.classList.add('on'); hoja.setAttribute('aria-hidden','false');
}
function cerrarHoja(){
  hoja.classList.remove('on'); hoja.setAttribute('aria-hidden','true');
  document.getElementById('nota').blur();
}
document.getElementById('abrir').onclick = () => abrirHoja();
document.getElementById('cancelar').onclick = cerrarHoja;
document.getElementById('guardar').onclick = () => {
  const c = valor(); if(c <= 0) return;
  gastos.push({id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
               c, cat: catSel, n: document.getElementById('nota').value.trim(), t: Date.now()});
  salvar(); pintar(); cerrarHoja(); avisar('Guardado ' + eur(c));
};

/* ---------- Copias ---------- */
const bajar = (txt, nombre, tipo) => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], {type: tipo}));
  a.download = nombre; a.click(); URL.revokeObjectURL(a.href);
};
const dlg = document.getElementById('ajustes');
document.getElementById('abrirAjustes').onclick = () => dlg.classList.add('on');
document.getElementById('cerrarAjustes').onclick = () => dlg.classList.remove('on');
document.getElementById('exportar').onclick = () =>
  bajar(JSON.stringify(gastos), `gastos-${new Date().toISOString().slice(0,10)}.json`, 'application/json');
document.getElementById('csv').onclick = () =>
  bajar('fecha;importe;categoria;nota\n' + [...gastos].sort((a,b)=>a.t-b.t)
    .map(g => `${new Date(g.t).toISOString()};${g.c.toFixed(2).replace('.',',')};${g.cat};"${(g.n||'').replace(/"/g,'""')}"`)
    .join('\n'), 'gastos.csv', 'text/csv');
document.getElementById('importar').onclick = () => document.getElementById('fichero').click();
document.getElementById('fichero').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  try {
    const datos = JSON.parse(await f.text());
    if(!Array.isArray(datos)) throw 0;
    const vistos = new Set(gastos.map(g => g.id));
    gastos = gastos.concat(datos.filter(g => g && !vistos.has(g.id)));
    salvar(); pintar(); dlg.classList.remove('on'); avisar('Copia restaurada');
  } catch { avisar('Ese archivo no es una copia válida') }
  e.target.value = '';
};

/* ---------- Arranque ---------- */
pintar();
const p = new URLSearchParams(location.search);
if(p.has('add')) abrirHoja(p.get('cat'));
history.replaceState(null, '', location.pathname);
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
